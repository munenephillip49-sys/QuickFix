<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", async function () {

  const SUPABASE_URL =
    "https://dpaqoamvgxbcztoaxxqv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_6KCoCn8dmj4NMQTpXu5G2Q_KuGxY4l7";

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const list =
    document.getElementById("notificationList");

  const { data: sessionData } =
    await client.auth.getSession();

  if (!sessionData.session) {
    window.location.href = "account.html";
    return;
  }

  const user =
    sessionData.session.user;

  async function loadNotifications() {

    const { data, error } =
      await client
        .from("notifications")
        .select("*")
        .eq("user_id", user.id)
        .order("created_at", {
          ascending: false
        })
        .limit(50);

    if (error) {
      list.innerHTML =
        '<div class="empty-notifications">Unable to load notifications.</div>';
      return;
    }

    if (!data || data.length === 0) {
      list.innerHTML =
        '<div class="empty-notifications">You have no notifications yet.</div>';
      return;
    }

    list.innerHTML = data.map(function (item) {

      const date =
        new Date(item.created_at);

      return `
        <article
          class="notification ${item.is_read ? "" : "unread"}"
          data-id="${item.id}"
        >
          <div class="notification-title">
            ${escapeHTML(item.title || "QuickFix Update")}
          </div>

          <div class="notification-message">
            ${escapeHTML(item.message || "")}
          </div>

          <div class="notification-time">
            ${date.toLocaleString()}
          </div>
        </article>
      `;

    }).join("");

    document
      .querySelectorAll(".notification")
      .forEach(function (element) {

        element.addEventListener("click", async function () {

          const id =
            element.dataset.id;

          await client
            .from("notifications")
            .update({
              is_read: true
            })
            .eq("id", id)
            .eq("user_id", user.id);

          element.classList.remove("unread");

        });

      });

  }

  document
    .getElementById("markAllRead")
    .addEventListener("click", async function () {

      await client
        .from("notifications")
        .update({
          is_read: true
        })
        .eq("user_id", user.id)
        .eq("is_read", false);

      loadNotifications();

    });

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  loadNotifications();

});
</script>
