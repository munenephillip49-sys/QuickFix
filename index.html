<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">
  <meta name="google-site-verification" content="BwR0IyMEc2oVNiFrgFB8BcfLp-lsrvcifv5HWmoqAB8" />
  <meta name="description" content="QuickFix helps you find reliable local service providers for plumbing, electrical work, phone repair, computer help, car repair, home repairs and more. Find local help near you.">
  <meta name="robots" content="index, follow">
  <meta name="keywords" content="QuickFix, local services, find a plumber, electrical services, phone repair, computer repair, car repair, home repairs, local service providers">

  <title>QuickFix | Find Reliable Local Service Providers</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==========================================
     NAVIGATION
========================================== -->

<nav class="site-nav">

  <a href="#home" class="logo" aria-label="QuickFix home">
    Quick<span>Fix</span>
  </a>

  <div class="nav-links">
    <a href="#home">Home</a>
    <a href="#services">Find a Fix</a>
    <a href="#how">How It Works</a>
    <a href="#about">About</a>
  </div>

  <div class="nav-actions">

    <button type="button" id="accountButton" class="account-btn">
      Customer Login
    </button>

    <button type="button" id="joinProvider" class="provider-btn">
      Join as Provider
    </button>

  </div>

</nav>


<!-- ==========================================
     MAIN
========================================== -->

<main>

<!-- HERO -->

<section id="home" class="hero">

  <p class="tagline">
    LOCAL HELP, MADE SIMPLE
  </p>

  <h1>
    Got a problem?<br>
    <span>Get it fixed.</span>
  </h1>

  <p class="hero-text">
    Find reliable people near you who can solve your everyday problems.
  </p>

  <div class="search-box" role="search">

    <input
      id="searchInput"
      type="text"
      placeholder="What do you need help with?"
    >

    <button id="searchButton">
      Find a Fix
    </button>

  </div>

</section>


<!-- RESULTS -->

<section id="results" class="results" aria-live="polite">
  <div class="results-header">
    <div>
      <p class="section-label">LOCAL PROVIDERS</p>
      <h2>Available help</h2>
    </div>
    <a href="#home" class="link-button">← Back to search</a>
  </div>
  <div id="providerList" class="provider-grid">
    <!-- Providers loaded here -->
  </div>
</section>


<!-- DASHBOARDS -->

<section id="dashboards">

  <!-- CUSTOMER DASHBOARD -->
  <div id="customerDashboard" class="dashboard">
    <div class="dashboard-header">
      <h2>Your Service Requests</h2>
      <button type="button" id="newRequestBtn" class="submit-button">
        + New Request
      </button>
    </div>
    <div id="customerRequestList" class="requests-list">
      <!-- Requests loaded here -->
    </div>
  </div>

  <!-- PROVIDER DASHBOARD -->
  <div id="providerDashboard" class="dashboard">
    <div class="dashboard-header">
      <h2>Your Requests</h2>
      <button type="button" id="earningsBtn" class="submit-button">
        💰 View Earnings
      </button>
    </div>
    <div id="requestList" class="requests-list">
      <!-- Requests loaded here -->
    </div>
  </div>

</section>


<!-- AUTHENTICATION MODALS -->

<div id="authModal" class="modal">
  <div class="modal-box">
    <button type="button" class="close-button">×</button>
    <div id="authContent">
      <!-- Auth forms loaded here -->
    </div>
  </div>
</div>

</main>

<!-- ==========================================
     SCRIPTS
========================================== -->

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Stripe -->
<script src="https://js.stripe.com/v3/"></script>

<!-- Core Application -->
<script src="script.js"></script>

<!-- Messaging Module -->
<script src="messaging.js"></script>

<!-- Payments Module -->
<script src="payments.js"></script>

</body>

</html>
